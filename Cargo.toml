[workspace]
resolver = "2"
members = [
    "apps/rustfus-worker",
    "crates/rustfus-core",
    "crates/rustfus-disk",
    "crates/rustfus-ffi",
    "crates/rustfus-image",
    "crates/rustfus-protocol",
    "crates/rustfus-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
tempfile = "3.19.1"

# Faster links and smaller target directories; backtraces still carry line numbers.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
overflow-checks = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
