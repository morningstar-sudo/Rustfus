name: Package

# Builds the portable Windows release and checks it as a user would receive it. Called by CI, so
# every push produces a tested artifact; the release workflow publishes that artifact for main.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Do not set RUSTFLAGS here: it would override the static-CRT setting in .cargo/config.toml.

jobs:
  package:
    runs-on: windows-2025
    # CODESIGN_PFX_* are secrets of the "sign" environment, visible only to a job that names it.
    environment: sign
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      # Only the two crates that ship; the rest of the workspace is built by the other jobs.
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc -p rustfus-ffi -p rustfus-worker
      - name: Package
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: .\scripts\package.ps1
      - name: Smoke test the package
        shell: powershell
        run: |
          $zip = Get-ChildItem dist -Filter "Rustfus-*-windows-x64.zip" | Select-Object -First 1
          .\scripts\smoke-test.ps1 -Archive $zip.FullName
      - name: Show the session log if the smoke test failed
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Rustfus\logs" -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: Rustfus-windows-x64
          path: |
            dist/Rustfus-*-windows-x64.zip
            dist/Rustfus-*-windows-x64.zip.sha256
          if-no-files-found: error
          # Releases keep their own copy of the files; this one is only for CI runs.
          retention-days: 14
