name: Disposable VHDX acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vhdx:
    runs-on: [self-hosted, Windows, X64, rustfus-disposable]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Verify elevated disposable runner
        shell: powershell
        run: .\scripts\test-vhdx.ps1
