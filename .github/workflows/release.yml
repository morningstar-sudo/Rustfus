name: Release

# Every push to main that passes CI is published as a pre-release tagged with the UTC time the
# package was built (for example 20261102.014500), created by `gh release create` at the exact
# commit CI tested. The ZIP is the (signed) artifact CI already built and smoke-tested; nothing
# is rebuilt here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    # Only for pushes to main (not pull requests) whose CI run succeeded.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      actions: read # download the artifact of the CI run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rustfus-windows-x64
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The package name carries the build stamp, which is also the tag.
      - name: Name the release
        id: name
        run: |
          zip=$(ls dist/Rustfus-*-windows-x64.zip)
          stamp=$(basename "$zip" | sed -E 's/^Rustfus-(.+)-windows-x64\.zip$/\1/')
          echo "tag=$stamp" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # Re-running this job for the same CI run yields the same tag, so it must not fail or duplicate.
      - name: Skip if already released
        id: released
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the checksum
        if: steps.released.outputs.exists != 'true'
        env:
          ZIP: ${{ steps.name.outputs.zip }}
        run: |
          expected=$(cut -d' ' -f1 "$ZIP.sha256")
          actual=$(sha256sum "$ZIP" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "Checksum mismatch: sidecar $expected, archive $actual" >&2
            exit 1
          fi

      - name: Create the tag and the pre-release
        if: steps.released.outputs.exists != 'true'
        env:
          TAG: ${{ steps.name.outputs.tag }}
          ZIP: ${{ steps.name.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --target "$HEAD_SHA" \
            --prerelease \
            --generate-notes \
            --title "Rustfus $TAG UTC"
